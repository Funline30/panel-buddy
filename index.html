<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AmpMap - map your breaker panel</title>
    <meta name="description" content="Free, no-ads breaker panel mapper. Label breakers, map every outlet and light, print QR stickers and check circuit loads." />
    <meta name="theme-color" content="#f6f7f9" />
    <script>try{var t=localStorage.getItem("panelbuddy:theme");var d=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";}catch(e){}</script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AmpMap" />
    <meta property="og:title" content="AmpMap - map your breaker panel" />
    <meta property="og:description" content="Map your breaker panel, outlets and lights. QR stickers and load checks. Free, no ads." />
  </head>
  <body>
    <div id="app"><noscript>AmpMap needs JavaScript turned on.</noscript></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
